
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="390"
     viewBox="0 0 760 390"
     role="img"
     aria-label="Ramez Engineering Radar">

  <defs>
    <linearGradient id="sweep" x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"
            stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2DD4BF"
            stop-opacity="0"/>
    </linearGradient>

    <style>
      text {
        font-family: monospace;
      }

      .heading {
        fill: #F8FAFC;
        font-size: 17px;
        font-weight: bold;
      }

      .label {
        fill: #E2E8F0;
        font-size: 14px;
        font-weight: bold;
      }

      .desc {
        fill: #94A3B8;
        font-size: 12px;
      }

      .small {
        fill: #64748B;
        font-size: 11px;
      }

      .scanner {
        transform-origin: 200px 219px;
        animation: rotate 6s linear infinite;
      }

      .blink {
        animation: blink 2.5s ease-in-out infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes blink {
        0%,100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      @keyframes pulse {
        0%,100% { opacity: .35; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .scanner, .blink, .pulse {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Main Frame -->
  <rect width="760" height="390"
        rx="16" fill="#0B1220"/>

  <rect x="1" y="1" width="758" height="388"
        rx="15" fill="none"
        stroke="#29374D" stroke-width="2"/>

  <!-- Header -->
  <rect x="1" y="1" width="758" height="56"
        rx="15" fill="#152238"/>
  <rect x="1" y="41" width="758" height="15"
        fill="#152238"/>

  <text x="25" y="35" class="heading">
    RAMEZ.DEV / ENGINEERING RADAR
  </text>

  <circle cx="635" cy="28" r="5"
          fill="#34D399" class="blink"/>

  <text x="649" y="33"
        fill="#34D399" font-size="12">
    SCANNING
  </text>

  <!-- Radar background -->
  <circle cx="200" cy="219" r="135"
          fill="#0D1E2D" stroke="#28586B"/>

  <!-- Range rings -->
  <g fill="none" stroke="#25546A"
     stroke-width="1">
    <circle cx="200" cy="219" r="34"/>
    <circle cx="200" cy="219" r="68"/>
    <circle cx="200" cy="219" r="102"/>
    <circle cx="200" cy="219" r="134"/>
  </g>

  <!-- Crosshairs -->
  <path d="M200 84 V354 M65 219 H335"
        stroke="#25546A" stroke-width="1"/>

  <!-- Rotating sweep -->
  <g class="scanner">
    <path d="M200 219 L200 84
             A135 135 0 0 1 317 151 Z"
          fill="url(#sweep)"/>
    <path d="M200 219 L200 84"
          stroke="#2DD4BF"
          stroke-width="2" opacity=".75"/>
  </g>

  <!-- Detected points -->
  <g fill="#34D399" stroke="#A7F3D0"
     stroke-width="1">
    <circle cx="145" cy="142" r="5" class="pulse"/>
    <circle cx="277" cy="166" r="5" class="blink"/>
    <circle cx="117" cy="273" r="5" class="pulse"/>
    <circle cx="267" cy="291" r="5" class="blink"/>
    <circle cx="219" cy="118" r="5" class="pulse"/>
  </g>

  <!-- Radar center -->
  <circle cx="200" cy="219" r="7"
          fill="#2DD4BF"/>

  <!-- Sidebar -->
  <text x="390" y="95" class="small">
    DETECTED ENGINEERING DOMAINS
  </text>

  <path d="M390 108 H725"
        stroke="#29374D"/>

  <!-- Domain 1 -->
  <circle cx="400" cy="139" r="5"
          fill="#34D399" class="pulse"/>
  <text x="417" y="144" class="label">
    FULL-STACK DEVELOPMENT
  </text>
  <text x="417" y="162" class="desc">
    React / ASP.NET Core / Node.js
  </text>

  <!-- Domain 2 -->
  <circle cx="400" cy="192" r="5"
          fill="#34D399" class="blink"/>
  <text x="417" y="197" class="label">
    API ENGINEERING
  </text>
  <text x="417" y="215" class="desc">
    REST APIs / JWT / Authorization
  </text>

  <!-- Domain 3 -->
  <circle cx="400" cy="245" r="5"
          fill="#34D399" class="pulse"/>
  <text x="417" y="250" class="label">
    DATA SYSTEMS
  </text>
  <text x="417" y="268" class="desc">
    SQL Server / PostgreSQL / MongoDB
  </text>

  <!-- Domain 4 -->
  <circle cx="400" cy="298" r="5"
          fill="#34D399" class="blink"/>
  <text x="417" y="303" class="label">
    CLOUD DELIVERY
  </text>
  <text x="417" y="321" class="desc">
    Netlify / Render
  </text>

  <!-- Domain 5 -->
  <circle cx="400" cy="351" r="5"
          fill="#A78BFA" class="pulse"/>
  <text x="417" y="356"
        fill="#C4B5FD"
        font-size="14" font-weight="bold">
    AI ENGINEERING
  </text>
  <text x="575" y="356"
        fill="#A78BFA" font-size="11">
    IN PROGRESS
  </text>

  <!-- Footer -->
  <text x="25" y="379" class="small">
    ENGINEERING SIGNALS / VISUAL PROFILE
  </text>

</svg>

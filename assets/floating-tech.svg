
<svg xmlns="http://www.w3.org/2000/svg"
     width="520" height="110"
     viewBox="0 0 520 110">

  <style>
    .float {
      animation: floating 3.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .one   { animation-delay: 0s; }
    .two   { animation-delay: -0.5s; }
    .three { animation-delay: -1s; }
    .four  { animation-delay: -1.5s; }
    .five  { animation-delay: -2s; }
    .six   { animation-delay: -2.5s; }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .float { animation: none; }
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      fill: white;
      text-anchor: middle;
    }
  </style>

  <g class="float one">
    <rect x="30" y="32" width="58" height="58"
          rx="12" fill="#512BD4"/>
    <text x="59" y="68" class="label">C#</text>
  </g>

  <g class="float two">
    <rect x="110" y="32" width="58" height="58"
          rx="12" fill="#F7DF1E"/>
    <text x="139" y="68" class="label"
          fill="#111111" style="fill:#111111">JS</text>
  </g>

  <g class="float three">
    <rect x="190" y="32" width="58" height="58"
          rx="12" fill="#3178C6"/>
    <text x="219" y="68" class="label">TS</text>
  </g>

  <g class="float four">
    <rect x="270" y="32" width="58" height="58"
          rx="12" fill="#142C47"
          stroke="#61DAFB" stroke-width="2"/>
    <circle cx="299" cy="61" r="4" fill="#61DAFB"/>
    <ellipse cx="299" cy="61" rx="22" ry="8"
             fill="none" stroke="#61DAFB"
             stroke-width="2"/>
    <ellipse cx="299" cy="61" rx="22" ry="8"
             fill="none" stroke="#61DAFB"
             stroke-width="2"
             transform="rotate(60 299 61)"/>
    <ellipse cx="299" cy="61" rx="22" ry="8"
             fill="none" stroke="#61DAFB"
             stroke-width="2"
             transform="rotate(120 299 61)"/>
  </g>

  <g class="float five">
    <rect x="350" y="32" width="58" height="58"
          rx="12" fill="#512BD4"/>
    <text x="379" y="68"
          class="label" font-size="15">.NET</text>
  </g>

  <g class="float six">
    <rect x="430" y="32" width="58" height="58"
          rx="12" fill="#092E20"
          stroke="#10B981" stroke-width="2"/>
    <text x="459" y="68" class="label"
          font-size="14">DB</text>
  </g>

</svg>


from pathlib import Path
from PIL import Image, ImageDraw, ImageFont
import math

OUTPUT = Path("assets/icons")
OUTPUT.mkdir(parents=True, exist_ok=True)

# Icon name: (symbol, background color, text color)
ICONS = {
    "cs": ("C#", "#512BD4", "#FFFFFF"),
    "javascript": ("JS", "#F7DF1E", "#111111"),
    "typescript": ("TS", "#3178C6", "#FFFFFF"),

    "react": ("R", "#17354A", "#61DAFB"),
    "html": ("H5", "#E34F26", "#FFFFFF"),
    "css": ("C3", "#1572B6", "#FFFFFF"),
    "tailwind": ("TW", "#0891B2", "#FFFFFF"),
    "bootstrap": ("B", "#7952B3", "#FFFFFF"),
    "vite": ("V", "#646CFF", "#FFFFFF"),

    "dotnet": (".NET", "#512BD4", "#FFFFFF"),
    "node": ("N", "#43853D", "#FFFFFF"),
    "express": ("EX", "#252D3B", "#FFFFFF"),

    "postgres": ("PG", "#336791", "#FFFFFF"),
    "mysql": ("MY", "#00758F", "#FFFFFF"),
    "mongodb": ("M", "#166534", "#FFFFFF"),
    "supabase": ("S", "#148F64", "#FFFFFF"),

    "git": ("G", "#F05032", "#FFFFFF"),
    "github": ("GH", "#24292F", "#FFFFFF"),
    "postman": ("P", "#FF6C37", "#FFFFFF"),
    "vscode": ("VS", "#007ACC", "#FFFFFF"),

    "web": ("WEB", "#0F766E", "#FFFFFF"),
    "netlify": ("N", "#00AD9F", "#FFFFFF"),
    "linkedin": ("in", "#0A66C2", "#FFFFFF"),
    "email": ("@", "#EA4335", "#FFFFFF"),
    "resume": ("PDF", "#B91C1C", "#FFFFFF"),
}

CANVAS_W = 72
CANVAS_H = 88
TILE_SIZE = 58
FRAMES = 24
DURATION = 75  # milliseconds per frame

def load_font(size):
    candidates = [
        "C:/Windows/Fonts/arialbd.ttf",
        "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
        "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
    ]

    for path in candidates:
        if Path(path).exists():
            return ImageFont.truetype(path, size)

    return ImageFont.load_default()

def generate_icon(name, symbol, bg, fg, index):
    frames = []

    # Different phase for every icon
    phase = index * 0.65

    for frame_index in range(FRAMES):
        image = Image.new(
            "RGBA",
            (CANVAS_W, CANVAS_H),
            (0, 0, 0, 0)
        )

        draw = ImageDraw.Draw(image)

        t = 2 * math.pi * frame_index / FRAMES

        # Smooth vertical floating motion
        offset = math.sin(t + phase) * 6

        x = (CANVAS_W - TILE_SIZE) // 2
        y = int(15 + offset)

        # Soft shadow
        draw.rounded_rectangle(
            [x + 2, y + 5, x + TILE_SIZE + 2, y + TILE_SIZE + 5],
            radius=13,
            fill=(0, 0, 0, 65)
        )

        # Square icon tile
        draw.rounded_rectangle(
            [x, y, x + TILE_SIZE, y + TILE_SIZE],
            radius=12,
            fill=bg,
            outline="#31465F",
            width=1
        )

        # Small highlight
        draw.line(
            [(x + 12, y + 8), (x + TILE_SIZE - 12, y + 8)],
            fill=(255, 255, 255, 65),
            width=2
        )

        font_size = 13 if len(symbol) >= 4 else 19
        font = load_font(font_size)

        box = draw.textbbox((0, 0), symbol, font=font)
        text_w = box[2] - box[0]
        text_h = box[3] - box[1]

        text_x = x + (TILE_SIZE - text_w) / 2
        text_y = y + (TILE_SIZE - text_h) / 2 - box[1]

        draw.text(
            (text_x, text_y),
            symbol,
            font=font,
            fill=fg
        )

        frames.append(image)

    # Save as animated GIF
    output_path = OUTPUT / f"{name}.gif"

    frames[0].save(
        output_path,
        save_all=True,
        append_images=frames[1:],
        duration=DURATION,
        loop=0,
        disposal=2,
        optimize=False
    )

    print(f"Created: {output_path}")

for index, (name, values) in enumerate(ICONS.items()):
    generate_icon(name, *values, index)

print(f"\nDone! Created {len(ICONS)} animated GIF icons.")
